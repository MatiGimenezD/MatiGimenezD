<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="240 20 800 760" role="img" aria-labelledby="t">
  <title id="t">Animated demo: a client books an appointment with Citax over WhatsApp</title>
  <rect x="260" y="40" width="760" height="720" rx="30" fill="#0b0b0b" stroke="#262626" stroke-width="2"/>
  <circle cx="322" cy="100" r="26" fill="#ff9a3c"/>
  <text x="322" y="111" text-anchor="middle" fill="#000" font-family="Georgia, serif" font-size="32" font-weight="bold">C</text>
  <text x="364" y="96" fill="#f2f2f2" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="600">Citax</text>
  <circle cx="368" cy="120" r="5" fill="#ff9a3c"/>
  <text x="382" y="126" fill="#8c8c8c" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20">asistente virtual</text>
  <path d="M260 152 H1020" stroke="#262626" stroke-width="2"/>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.0556;0.0750;0.8889;0.9556;1' dur='18.0s' repeatCount='indefinite'/><animateTransform attributeName='transform' type='translate' values='0 14;0 14;0 0;0 0' keyTimes='0;0.0556;0.0750;1' dur='18.0s' repeatCount='indefinite'/><rect x='580' y='180' width='400' height='108' rx='24' fill='#ff9a3c' fill-opacity='.16' stroke='#ff9a3c' stroke-opacity='.55'/><text fill='#ffe2bf' font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size='29'><tspan x='606' y='226'>Hola! Quiero un turno</tspan><tspan x='606' y='264'>para kinesiología</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.1111;0.1222;0.2111;0.2194;1' dur='18.0s' repeatCount='indefinite'/><rect x='300' y='318' width='122' height='64' rx='22' fill='#171717'/><circle cx='334' cy='350' r='6' fill='#8c8c8c'><animate attributeName='cy' values='350;342;350' dur='.9s' begin='0.0s' repeatCount='indefinite'/></circle><circle cx='358' cy='350' r='6' fill='#8c8c8c'><animate attributeName='cy' values='350;342;350' dur='.9s' begin='0.15s' repeatCount='indefinite'/></circle><circle cx='382' cy='350' r='6' fill='#8c8c8c'><animate attributeName='cy' values='350;342;350' dur='.9s' begin='0.3s' repeatCount='indefinite'/></circle></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.2111;0.2306;0.8889;0.9556;1' dur='18.0s' repeatCount='indefinite'/><animateTransform attributeName='transform' type='translate' values='0 14;0 14;0 0;0 0' keyTimes='0;0.2111;0.2306;1' dur='18.0s' repeatCount='indefinite'/><rect x='300' y='318' width='470' height='146' rx='24' fill='#171717' stroke='#2a2a2a'/><text fill='#f2f2f2' font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size='29'><tspan x='326' y='364'>¡Hola! Mañana tengo lugar</tspan><tspan x='326' y='402'>a las 10:00, 11:30 o 16:00.</tspan><tspan x='326' y='440'>¿Cuál te sirve?</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.3889;0.4083;0.8889;0.9556;1' dur='18.0s' repeatCount='indefinite'/><animateTransform attributeName='transform' type='translate' values='0 14;0 14;0 0;0 0' keyTimes='0;0.3889;0.4083;1' dur='18.0s' repeatCount='indefinite'/><rect x='854' y='490' width='126' height='70' rx='24' fill='#ff9a3c' fill-opacity='.16' stroke='#ff9a3c' stroke-opacity='.55'/><text fill='#ffe2bf' font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size='29'><tspan x='880' y='536'>11:30</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.4444;0.4556;0.5444;0.5528;1' dur='18.0s' repeatCount='indefinite'/><rect x='300' y='578' width='122' height='64' rx='22' fill='#171717'/><circle cx='334' cy='610' r='6' fill='#8c8c8c'><animate attributeName='cy' values='610;602;610' dur='.9s' begin='0.0s' repeatCount='indefinite'/></circle><circle cx='358' cy='610' r='6' fill='#8c8c8c'><animate attributeName='cy' values='610;602;610' dur='.9s' begin='0.15s' repeatCount='indefinite'/></circle><circle cx='382' cy='610' r='6' fill='#8c8c8c'><animate attributeName='cy' values='610;602;610' dur='.9s' begin='0.3s' repeatCount='indefinite'/></circle></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.5444;0.5639;0.8889;0.9556;1' dur='18.0s' repeatCount='indefinite'/><animateTransform attributeName='transform' type='translate' values='0 14;0 14;0 0;0 0' keyTimes='0;0.5444;0.5639;1' dur='18.0s' repeatCount='indefinite'/><rect x='300' y='578' width='470' height='146' rx='24' fill='#171717' stroke='#2a2a2a'/><text fill='#f2f2f2' font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size='29'><tspan x='326' y='624'>Listo, turno confirmado:</tspan><tspan x='326' y='662'>mañana a las 11:30.</tspan><tspan x='326' y='700'>Te aviso un rato antes.</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.6056;0.6278;0.8889;0.9556;1' dur='18.0s' repeatCount='indefinite'/><circle cx='986' cy='721' r='15' fill='#ff9a3c'/><path d='M979 721 L984.5 726.5 L993.5 715.5' fill='none' stroke='#000' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/><text x='960' y='728' text-anchor='end' fill='#ff9a3c' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='19' letter-spacing='3'>TURNO AGENDADO</text></g>
