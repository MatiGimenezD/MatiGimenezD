<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Matías Giménez — Developer and Systems Analyst</title>
  <desc id="d">Black banner with a sun whose ray of light crosses a prism and fans out into a spectrum, like the portfolio.</desc>
  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3da"/>
      <stop offset="0.18" stop-color="#ffb86b" stop-opacity=".95"/>
      <stop offset="0.5" stop-color="#ff9a3c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="80" y1="404" x2="872" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb86b" stop-opacity=".9"/>
      <stop offset="0.35" stop-color="#fff3da" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8fa4d0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="r1" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e5352b" stop-opacity=".95"/><stop offset="1" stop-color="#e5352b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r2" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f08a24" stop-opacity=".95"/><stop offset="1" stop-color="#f08a24" stop-opacity="0"/></linearGradient>
    <linearGradient id="r3" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6d03b" stop-opacity=".95"/><stop offset="1" stop-color="#f6d03b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r4" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5fae4b" stop-opacity=".95"/><stop offset="1" stop-color="#5fae4b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r5" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2e78c2" stop-opacity=".95"/><stop offset="1" stop-color="#2e78c2" stop-opacity="0"/></linearGradient>
    <linearGradient id="r6" x1="1008" y1="196" x2="1280" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6b4c9a" stop-opacity=".95"/><stop offset="1" stop-color="#6b4c9a" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="clip"><rect width="1280" height="440"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="#000"/>

  <g clip-path="url(#clip)">
    <!-- estrellas -->
    <g fill="#fff">
      <circle cx="610" cy="48" r="1" opacity=".5"/><circle cx="720" cy="92" r="1.2" opacity=".35"/>
      <circle cx="540" cy="140" r=".9" opacity=".4"/><circle cx="1180" cy="40" r="1.1" opacity=".5"/>
      <circle cx="790" cy="30" r=".9" opacity=".3"/><circle cx="360" cy="30" r="1" opacity=".3"/>
      <circle cx="1240" cy="320" r="1" opacity=".35"/><circle cx="470" cy="388" r="1" opacity=".3"/>
      <circle cx="640" cy="360" r=".9" opacity=".3"/><circle cx="250" cy="260" r="1" opacity=".25"/>
      <circle cx="1100" cy="400" r="1" opacity=".3"/><circle cx="880" cy="410" r=".8" opacity=".3"/>
    </g>

    <!-- sol -->
    <circle cx="80" cy="404" r="230" fill="url(#sun)"/>

    <!-- rayo de entrada -->
    <path d="M80 404 L872 216" stroke="#ff9a3c" stroke-opacity=".35" stroke-width="16" filter="url(#blur)"/>
    <path d="M80 404 L872 216" stroke="url(#beam)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- espectro -->
    <g filter="url(#blur)" opacity=".55">
      <path d="M1008 196 L1290 20" stroke="url(#r1)" stroke-width="12"/>
      <path d="M1008 196 L1290 100" stroke="url(#r2)" stroke-width="12"/>
      <path d="M1008 196 L1290 180" stroke="url(#r3)" stroke-width="12"/>
      <path d="M1008 196 L1290 260" stroke="url(#r4)" stroke-width="12"/>
      <path d="M1008 196 L1290 340" stroke="url(#r5)" stroke-width="12"/>
      <path d="M1008 196 L1290 420" stroke="url(#r6)" stroke-width="12"/>
    </g>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M1008 196 L1290 20" stroke="url(#r1)"/>
      <path d="M1008 196 L1290 100" stroke="url(#r2)"/>
      <path d="M1008 196 L1290 180" stroke="url(#r3)"/>
      <path d="M1008 196 L1290 260" stroke="url(#r4)"/>
      <path d="M1008 196 L1290 340" stroke="url(#r5)"/>
      <path d="M1008 196 L1290 420" stroke="url(#r6)"/>
    </g>

    <!-- prisma -->
    <path d="M940 60 L1070 340 L810 340 Z" fill="url(#glass)"/>
    <path d="M872 216 L1008 196" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M940 60 L1070 340 L810 340 Z" fill="none" stroke="url(#rim)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M940 60 L1070 340 L810 340 Z" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="6" stroke-linejoin="round" filter="url(#soft)"/>
    <circle cx="872" cy="216" r="3" fill="#fff"/>
  </g>

  <!-- texto -->
  <text x="84" y="76" fill="#ff9a3c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3">// SYSTEMS ANALYST · AI AUTOMATION</text>
  <text x="80" y="170" fill="#f2f2f2" font-family="Georgia, 'Times New Roman', serif" font-size="84" letter-spacing="-2">Matías <tspan fill="#ff9a3c" font-style="italic">Giménez</tspan></text>
  <text x="84" y="222" fill="#8c8c8c" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25">Software that solves real problems, running in production.</text>
  <path d="M84 244 H176" stroke="#ff9a3c" stroke-width="3"/>
</svg>
